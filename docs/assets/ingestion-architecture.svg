<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" font-family="Inter, sans-serif" font-size="13">
  <!-- S3 Bucket -->
  <rect x="20" y="50" width="140" height="60" rx="8" fill="#F4F8FB" stroke="#11567F" stroke-width="2"/>
  <text x="90" y="85" text-anchor="middle" fill="#11567F" font-weight="600">S3 Bucket</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="80" x2="220" y2="80" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="70" text-anchor="middle" fill="#666" font-size="11">event notification</text>

  <!-- Snowpipe -->
  <rect x="220" y="50" width="140" height="60" rx="8" fill="#E8F7FC" stroke="#29B5E8" stroke-width="2"/>
  <text x="290" y="85" text-anchor="middle" fill="#11567F" font-weight="600">Snowpipe</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="80" x2="420" y2="80" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="70" text-anchor="middle" fill="#666" font-size="11">COPY INTO</text>

  <!-- RAW.EVENTS -->
  <rect x="420" y="50" width="140" height="60" rx="8" fill="#E8F7FC" stroke="#29B5E8" stroke-width="2"/>
  <text x="490" y="85" text-anchor="middle" fill="#11567F" font-weight="600">RAW.EVENTS</text>

  <!-- Arrow 3 -->
  <line x1="560" y1="80" x2="620" y2="80" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="70" text-anchor="middle" fill="#666" font-size="11">stream</text>

  <!-- Task -->
  <rect x="620" y="50" width="80" height="60" rx="8" fill="#E8F7FC" stroke="#29B5E8" stroke-width="2"/>
  <text x="660" y="85" text-anchor="middle" fill="#11567F" font-weight="600">Task</text>

  <!-- Arrow 4 -->
  <line x1="700" y1="80" x2="730" y2="80" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- STAGING.EVENTS (shifted right for visibility) -->
  <rect x="620" y="120" width="160" height="30" rx="6" fill="#11567F" stroke="none"/>
  <text x="700" y="140" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">STAGING.EVENTS</text>

  <!-- Arrow 4 (down to staging) -->
  <line x1="660" y1="110" x2="660" y2="120" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="115" fill="#666" font-size="11">transform</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#29B5E8"/>
    </marker>
  </defs>
</svg>
